# The api, bot and worker connect as a runtime role with data rights only; the schema owner
# (POSTGRES_USER) is given to the one-shot migrate service alone, which also grants the runtime
# role its rights. Restores run through the migrate service for the same reason (SEC-F26).
x-env: &env
  DATABASE_URL: postgresql+asyncpg://${POSTGRES_APP_USER:-paurubot_app}:${POSTGRES_APP_PASSWORD:?set POSTGRES_APP_PASSWORD}@postgres:5432/${POSTGRES_DB:-paurubot}
  REDIS_URL: redis://redis:6379/0
  # env_file hands every container all of .env, the owner's password too (AUD-2). No running
  # process needs it: compose reads it from .env to build the migrate service's URL.
  POSTGRES_PASSWORD: ""

x-app: &app
  image: ${PAURUBOT_IMAGE:-paurubot:local}
  build: .
  restart: unless-stopped
  env_file: .env
  environment: *env
  read_only: true
  tmpfs: [/tmp]
  volumes:
    - backups:/var/lib/paurubot/backups
  depends_on:
    postgres:
      condition: service_healthy
    redis:
      condition: service_healthy

services:
  migrate:
    <<: *app
    restart: "no"
    command: ["migrate"]
    environment:
      <<: *env
      DATABASE_OWNER_URL: postgresql+asyncpg://${POSTGRES_USER:-paurubot}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-paurubot}

  api:
    <<: *app
    command: ["api"]
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8080/readyz"]
      interval: 30s
      timeout: 5s
      retries: 3

  bot:
    <<: *app
    command: ["bot"]
    depends_on:
      migrate:
        condition: service_completed_successfully

  worker:
    <<: *app
    command: ["worker"]
    # Longer than the worker's 30 s shutdown grace (SEC-F16): running jobs finish before SIGKILL.
    stop_grace_period: 40s
    depends_on:
      migrate:
        condition: service_completed_successfully

  postgres:
    image: ${POSTGRES_IMAGE:-postgres:16-alpine}
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-paurubot}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-paurubot}
    volumes:
      - postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-paurubot}"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: ${REDIS_IMAGE:-redis:7-alpine}
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--maxmemory-policy", "noeviction"]
    volumes:
      - redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  caddy:
    image: ${CADDY_IMAGE:-caddy:2-alpine}
    restart: unless-stopped
    environment:
      DOMAIN: ${DOMAIN:?set DOMAIN}
    ports:
      - "80:80"
      - "${HTTPS_PORT:-443}:443"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - api

volumes:
  postgres:
  redis:
  backups:
  caddy_data:
  caddy_config:
