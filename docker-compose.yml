services:
  bot:
    build: .
    image: paurubot:latest
    container_name: paurubot
    restart: unless-stopped
    env_file: .env
    ports:
      - "${WEB_PORT:-8080}:${WEB_PORT:-8080}"
    volumes:
      - ./data:/app/data
    depends_on:
      db:
        condition: service_healthy
        required: false

  db:
    image: postgres:16-alpine
    container_name: paurubot-db
    restart: unless-stopped
    profiles: ["postgres"]
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-paurubot}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-paurubot}
      POSTGRES_DB: ${POSTGRES_DB:-paurubot}
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-paurubot}"]
      interval: 10s
      timeout: 5s
      retries: 5
