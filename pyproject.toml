[project]
name = "paurubot"
version = "0.1.9"
description = "Telegram VPN subscription sales bot with multi-panel support"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "aiogram>=3.15,<4",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.29",
    "alembic>=1.13",
    "httpx>=0.27.2,<0.29",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "python-multipart>=0.0.9",
    "qrcode[pil]>=7.4",
    "argon2-cffi>=23.1,<26",
    "redis>=5.0",
    "cryptography>=42",
    "pillow>=10.0",
    "openpyxl>=3.1.5",
]

[project.optional-dependencies]
sentry = ["sentry-sdk>=2.0"]

dev = ["pytest>=8", "pytest-asyncio>=0.24", "ruff>=0.5", "mypy>=1.10", "fakeredis[lua]>=2.26,<3"]

[project.scripts]
paurubot = "paurubot.__main__:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["paurubot*"]

[tool.setuptools.package-data]
paurubot = ["i18n/*.json", "payments/*.json", "assets/fonts/*"]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "ASYNC"]
ignore = ["E501", "B008"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]
markers = ["security: security regression suite (QA-01)"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
warn_unused_ignores = false
check_untyped_defs = true
plugins = ["pydantic.mypy"]

[tool.ruff.lint.per-file-ignores]
"tests/fakes/*" = ["ASYNC109"]
