name: debug-f02
on:
  pull_request:
permissions:
  contents: read
  pull-requests: write
jobs:
  diag:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: paurubot_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
    env:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@127.0.0.1:5432/paurubot_test
      REDIS_URL: redis://127.0.0.1:6379/15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt pytest pytest-asyncio ruff mypy
      - name: diag
        run: |
          {
            echo '### lint'; ruff check paurubot tests 2>&1 | tail -30; ruff format --check paurubot tests 2>&1 | tail -10
            echo '### mypy'; mypy paurubot 2>&1 | tail -30
            echo '### tests'; pytest -q -x --tb=short tests/unit/test_auto_renew.py tests/unit/test_i18n.py 2>&1 | tail -60
          } > diag.txt || true
          { echo '```'; head -c 60000 diag.txt; echo '```'; } > body.md
          gh pr comment ${{ github.event.pull_request.number }} --body-file body.md
        env:
          GH_TOKEN: ${{ github.token }}
