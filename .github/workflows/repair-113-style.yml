name: Normalize merged gateway import grouping
on:
  push:
    branches: [feat/mender-tonpay-standard]
    paths: [.github/workflows/repair-113-style.yml]
permissions:
  contents: read
jobs:
  normalize-import-group:
    if: github.repository == 'MenderBaga/PauruBot' && github.ref == 'refs/heads/feat/mender-tonpay-standard'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import ast
          from pathlib import Path
          path = Path('paurubot/payments/providers/gateways.py')
          source = path.read_text()
          old = 'from typing import Any\n\nfrom urllib.parse import quote, urlsplit\n'
          assert source.count(old) == 1
          revised = source.replace(old, old.replace('Any\n\n', 'Any\n'), 1)
          assert ast.dump(ast.parse(source), include_attributes=False) == ast.dump(ast.parse(revised), include_attributes=False)
          path.write_text(revised)
          PY
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- paurubot/payments/providers/gateways.py
          git commit -m 'style: keep merged urllib helpers in the standard-library import group'
          git push origin HEAD:refs/heads/feat/mender-tonpay-standard
