name: Repair PR 113 integration
on:
  push:
    branches: [feat/mender-tonpay-standard]
    paths: [.github/workflows/repair-113-integration.yml]
permissions:
  contents: read
jobs:
  integrate-disabled-tonpay:
    if: github.repository == 'MenderBaga/PauruBot' && github.ref == 'refs/heads/feat/mender-tonpay-standard'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # Temporary maintenance; only inline parsing/git execute, never repository code.
      - name: Integrate using the reviewed dependency snapshot where ancestry diverged
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git merge --no-ff --no-commit 0b6dcbee429c44ad7ac4c6e7b9bbe60225a27f51 || git rev-parse --verify MERGE_HEAD
          python3 - <<'PY'
          import json
          import subprocess
          from pathlib import Path
          def git(*args):
              return subprocess.check_output(['git', *args], text=True)
          conflicts = git('diff', '--name-only', '--diff-filter=U').splitlines()
          Path('/tmp/pr113-conflicts.json').write_text(json.dumps(conflicts))
          baseline = '875592376ab1888fb3f8953d571a26dd5dcc34a7'
          allowed = {'paurubot/payments/durable_checkout.py', 'paurubot/payments/intents.py', 'paurubot/payments/providers/gateways.py', 'paurubot/core/settings.py', 'tests/security/test_durable_hosted_checkout.py', 'docs/reference/settings.md', 'frontend/tests/ux.test.mjs'}
          locales = {'frontend/src/app/locales/en.json', 'frontend/src/app/locales/fa.json', 'frontend/src/admin/locales/en.json', 'frontend/src/admin/locales/fa.json', 'paurubot/i18n/en.json', 'paurubot/i18n/fa.json'}
          assert set(conflicts) <= allowed | locales, 'Unexpected conflicts need manual review'
          missing = object()
          for index, name in enumerate(conflicts):
              ours, theirs = git('show', f':2:{name}'), git('show', f':3:{name}')
              base = git('show', f'{baseline}:{name}')
              if name in locales:
                  left, right, old = map(json.loads, (ours, theirs, base))
                  merged = {}
                  for key in dict.fromkeys([*right, *left, *old]):
                      a, b, c = left.get(key, missing), right.get(key, missing), old.get(key, missing)
                      if a == b:
                          value = a
                      elif a == c:
                          value = b
                      elif b == c:
                          value = a
                      else:
                          raise AssertionError(f'Locale conflict: {key}')
                      if value is not missing:
                          merged[key] = value
                  Path(name).write_text(json.dumps(merged, ensure_ascii=False, indent=2) + '\n')
              elif theirs == base:
                  Path(name).write_text(ours)
              elif ours == base:
                  Path(name).write_text(theirs)
              else:
                  raise AssertionError(f'Both dependency and feature changed: {name}')
              subprocess.run(['git', 'add', '--', name], check=True)
          assert not git('diff', '--name-only', '--diff-filter=U').strip()
          for locale in ('en', 'fa'):
              messages = json.loads(Path(f'frontend/src/app/locales/{locale}.json').read_text())
              for key in ('method_tonpay', 'alerts_policy_unavailable', 'service_rename', 'err_payment_intent_conflict', 'err_payment_intent_closed', 'err_payment_intent_invalid'):
                  assert messages[key]
          settings = Path('paurubot/core/settings.py').read_text()
          assert '"tonpay_enabled": Spec(bool, False, "gateways")' in settings
          PY
          git diff --cached --check
          git commit -m 'Merge reviewed main into disabled Tonpay adapter without discarding dependency fixes'
          git push origin HEAD:refs/heads/feat/mender-tonpay-standard
      - name: Publish only bounded conflict path diagnostics on failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        shell: python
        run: |
          import json, os, pathlib, urllib.request
          p = pathlib.Path('/tmp/pr113-conflicts.json')
          paths = json.loads(p.read_text()) if p.exists() else []
          safe = [x for x in paths if len(x) < 200 and all(c.isalnum() or c in '/_.-' for c in x)]
          body = 'Branch integration stopped safely; no unresolved merge was pushed. Conflicting paths: ' + ', '.join('`' + x + '`' for x in safe[:20]) + '. Manual semantic review required; no tests or protections were weakened.'
          data = json.dumps({'body': body}).encode()
          request = urllib.request.Request('https://api.github.com/repos/MenderBaga/PauruBot/issues/113/comments', data=data, headers={'Authorization': 'Bearer ' + os.environ['GH_TOKEN'], 'Accept': 'application/vnd.github+json'})
          with urllib.request.urlopen(request, timeout=20) as response:
              assert response.status == 201
