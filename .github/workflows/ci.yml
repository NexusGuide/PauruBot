name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: paurubot_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
    env:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@127.0.0.1:5432/paurubot_test
      REDIS_URL: redis://127.0.0.1:6379/15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt pytest pytest-asyncio 'pytest-timeout>=2.3,<3' ruff mypy
      - name: compile
        run: python -m compileall -q paurubot migrations
      - name: lint
        run: ruff check paurubot tests && ruff format --check paurubot tests
      - name: types
        run: mypy paurubot
      - name: security suite
        run: |
          set -o pipefail
          pytest -vv -m security -rf --tb=short --durations=20 --timeout=120 --timeout-method=thread -o faulthandler_timeout=60 --junitxml=security-results.xml 2>&1 | tee security.log
      - name: full test suite
        run: |
          set -o pipefail
          pytest -vv -rf --tb=short --durations=20 --timeout=120 --timeout-method=thread -o faulthandler_timeout=60 --junitxml=test-results.xml 2>&1 | tee tests.log
      - name: Show failures as annotations
        if: failure()
        run: grep -hE "^(FAILED|ERROR|E  )" security.log tests.log 2>/dev/null | head -40 | sed 's/^/::error::/' || true
      - name: Preserve Python test diagnostics
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: python-test-diagnostics-${{ github.run_attempt }}
          path: |
            security.log
            tests.log
            security-results.xml
            test-results.xml
          if-no-files-found: warn
          retention-days: 7

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Order draft contracts
        run: node --experimental-strip-types --test tests/order-draft.test.mjs
      - run: npm run test:auto-renew
      - run: npm run test:broadcasts
      - run: npm run test:capabilities
      - name: Payment resume contracts
        run: node --experimental-strip-types --test tests/payment-resume.test.mjs
      - run: npm run test:confirm
      - run: npm run test:help
      - run: npm run test:receipts
      - run: npm run test:tickets
      - run: npm run test:usage
      - run: npm run test:ux
      - run: npm run lint
      - run: npm run build
      - run: npm run test:reseller-hub
