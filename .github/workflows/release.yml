name: release

# Images: `edge` from main (beta channel), `X.Y.Z` and `latest` from version tags (stable channel).
# Every image is signed keylessly with cosign, so the installer can verify where it was built.
# A release is a pushed vX.Y.Z tag, or a manual run on main with `version`: that run tags the
# commit it built itself, once the signed image is pushed.

on:
  push:
    branches: [main]
    tags: ["v*.*.*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Release this commit of main as vX.Y.Z (X.Y.Z must match pyproject.toml); empty builds edge"
        required: false
        default: ""

concurrency:
  # A manual release never shares a group with pushes to main, which cancel each other.
  group: release-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: ${{ github.ref == 'refs/heads/main' && github.event_name == 'push' }}

permissions:
  contents: write
  packages: write
  id-token: write

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/paurubot

jobs:
  checks:
    uses: ./.github/workflows/ci.yml

  image:
    needs: checks
    runs-on: ubuntu-latest
    env:
      # vX.Y.Z when this run is a release, empty for an edge build.
      RELEASE: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || (github.event_name == 'workflow_dispatch' && inputs.version != '' && format('v{0}', inputs.version) || '') }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Image name in lower case
        run: echo "IMAGE=${IMAGE,,}" >> "$GITHUB_ENV"
      - name: Check the version being released
        if: env.RELEASE != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          have=$(sed -n 's/^version = "\(.*\)"$/\1/p' pyproject.toml)
          if [[ ! $RELEASE =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ || ${RELEASE#v} != "$have" ]]; then
            echo "::error::$RELEASE does not match pyproject.toml version $have"; exit 1
          fi
          if [[ $GITHUB_EVENT_NAME == workflow_dispatch && $GITHUB_REF != refs/heads/main ]]; then
            echo "::error::a manual release runs on main only"; exit 1
          fi
          # Before any image is pushed: a second manual run must not overwrite a released image.
          if [[ $GITHUB_EVENT_NAME == workflow_dispatch ]] \
            && gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${RELEASE}" >/dev/null 2>&1; then
            echo "::error::${RELEASE} is already tagged"; exit 1
          fi

      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      - uses: sigstore/cosign-installer@398d4b0eeef1380460a10c8013a76f728fb906ac # v3
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=edge,branch=main
            type=semver,pattern={{version}}
            type=raw,value=${{ inputs.version || 'unused' }},enable=${{ github.event_name == 'workflow_dispatch' && env.RELEASE != '' }}
            type=raw,value=latest,enable=${{ env.RELEASE != '' }}

      - id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Sign the image
        run: cosign sign --yes "${IMAGE}@${{ steps.build.outputs.digest }}"

      - name: Publish the release
        if: env.RELEASE != ''
        env:
          GH_TOKEN: ${{ github.token }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          if [[ $GITHUB_EVENT_NAME == workflow_dispatch ]]; then
            # Tag the commit this run built; an existing tag fails here, so nothing is released twice.
            gh api "repos/${GITHUB_REPOSITORY}/git/refs" -f ref="refs/tags/${RELEASE}" -f sha="${GITHUB_SHA}"
          fi
          printf '{"version":"%s","image":"%s@%s"}\n' "${RELEASE}" "${IMAGE}" "${DIGEST}" > release.json
          gh release create "${RELEASE}" release.json --generate-notes --verify-tag

  # Docker Hub refuses many Iranian addresses; keep copies of the base images next to ours on GHCR.
  mirror:
    needs: checks
    runs-on: ubuntu-latest
    steps:
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Copy base images
        run: |
          target="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/paurubot-mirror"
          for source in postgres:16-alpine redis:7-alpine caddy:2-alpine; do
            docker buildx imagetools create --tag "${target}:${source/:/-}" "docker.io/library/${source}"
          done
