name: repair-122-integration
on:
  push:
    branches: [feat/mender-owned-payment-inbox]
    paths: [.github/workflows/repair-122-integration.yml]
permissions:
  contents: write
jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Preserve reviewed main and payment resume checks
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import base64, os, pathlib, subprocess
          def git(*args, check=True):
              return subprocess.run(['git', *args], check=check, capture_output=True, text=True)
          def show(ref, path):
              return git('show', ref + ':' + path).stdout
          branch = 'feat/mender-owned-payment-inbox'
          parent = '094f38880cbe8042d60eb13e9a0ce4139f923a58'
          assert os.environ['GITHUB_REF'] == 'refs/heads/' + branch
          head = git('rev-parse', 'HEAD').stdout.strip()
          ci = '.github/workflows/ci.yml'
          tests = 'frontend/tests/topup-intents.test.mjs'
          assert git('rev-parse', head + ':' + ci).stdout.strip() == 'c781e28d20b18b5ba1914d9eb5f6b8dddd148a5d'
          assert git('rev-parse', head + ':' + tests).stdout.strip() == 'b06e0659811278eae254d3ce60af5f7106823abf'
          git('config', 'user.name', 'PauruBot integration repair')
          git('config', 'user.email', '155055819+mehdialij@users.noreply.github.com')
          result = git('merge', '--no-commit', '--no-ff', parent, check=False)
          assert result.returncode == 1
          conflicts = set(git('diff', '--name-only', '--diff-filter=U').stdout.splitlines())
          assert conflicts == {ci, tests}, 'unreviewed conflicts'
          def add_once(text, anchor, replacement):
              assert text.count(anchor) == 1
              return text.replace(anchor, replacement, 1)
          main_ci = show(parent, ci)
          anchor = '      - run: npm run test:capabilities\n'
          addition = '      - name: Payment resume contracts\n        run: node --experimental-strip-types --test tests/payment-resume.test.mjs\n'
          fixed_ci = add_once(main_ci, anchor, anchor + addition)
          main_tests = show(parent, tests)
          anchor = ' const Icon=()=>null,Button=()=>null,CountUp=()=>null,Screen=()=>null;'
          fixed_tests = add_once(main_tests, anchor, ' const Icon=()=>null,Button=()=>null,CountUp=()=>null,Screen=()=>null,PendingPayments=()=>null;')
          assert "assert.equal(history[0].key,'1:0')" in fixed_tests
          assert 'Password recovery contracts' in fixed_ci and 'Order draft contracts' in fixed_ci
          for path, content in ((ci, fixed_ci), (tests, fixed_tests)):
              pathlib.Path(path).write_text(content)
              git('add', '--', path)
          assert not git('diff', '--name-only', '--diff-filter=U').stdout.strip()
          git('diff', '--cached', '--check')
          git('commit', '-m', 'Merge reviewed main preserving saved payment, history and recovery tests')
          credential = base64.b64encode(('x-access-token:' + os.environ['GH_TOKEN']).encode()).decode()
          os.environ.update(GIT_CONFIG_COUNT='1', GIT_CONFIG_KEY_0='http.https://github.com/.extraheader', GIT_CONFIG_VALUE_0='AUTHORIZATION: basic ' + credential)
          git('push', 'origin', 'HEAD:refs/heads/' + branch)
          PY
