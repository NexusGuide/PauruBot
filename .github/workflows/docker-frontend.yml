name: Frontend Docker build
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  docker-frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build the actual frontend stage with its declared Node and Alpine image
        run: docker build --pull --target frontend --tag paurubot-frontend:ci .
      - name: Build the runtime image the release ships
        run: docker build --pull --tag paurubot:ci .
      - name: The image starts and its operator command works
        run: |
          docker run --rm paurubot:ci --version
          docker run --rm --entrypoint paurubot paurubot:ci --version
      - name: The proxy configuration is valid for the Caddy the installer runs
        run: |
          docker run --rm -e DOMAIN=panel.example.com \
            -v "$PWD/deploy/Caddyfile:/etc/caddy/Caddyfile:ro" \
            caddy:2-alpine caddy validate --config /etc/caddy/Caddyfile --adapter caddyfile
