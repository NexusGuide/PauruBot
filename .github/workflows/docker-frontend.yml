name: Frontend Docker build
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  docker-frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Build the actual frontend stage with its declared Node and Alpine image
        run: docker build --pull --target frontend --tag paurubot-frontend:ci .
      - name: Build the runtime image the release ships
        run: docker build --pull --tag paurubot:ci .
      - name: The image starts and its operator command works
        run: |
          docker run --rm paurubot:ci --version
          docker run --rm --entrypoint paurubot paurubot:ci --version
